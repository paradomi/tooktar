<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { width: 100%; height: 350px; border-radius: 15px; }
        #info-box {
            margin-top: 10px;
            padding: 14px 18px;
            background: #f0f4ff;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.6;
        }
        #info-box .title { font-weight: bold; font-size: 18px; margin-bottom: 6px; }
        #info-box .detail { color: #555; }
        #steps {
            margin-top: 10px;
            padding: 0 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        .step {
            padding: 10px 14px;
            margin: 4px 0;
            background: white;
            border-radius: 10px;
            font-size: 15px;
            border-left: 4px solid #3498db;
        }
        #kakao-link {
            display: block;
            text-align: center;
            margin-top: 8px;
            padding: 12px;
            background: #FEE500;
            color: #3C1E1E;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info-box">
        <div class="title" id="dest-title"></div>
        <div class="detail" id="route-info">경로를 계산하는 중...</div>
    </div>
    <div id="steps"></div>
    <a id="kakao-link" href="#" target="_blank">🗺️ 카카오맵에서 상세 보기</a>

    <script>
        // URL 파라미터 파싱
        var params = new URLSearchParams(window.location.search);
        var destLat = parseFloat(params.get('destLat'));
        var destLng = parseFloat(params.get('destLng'));
        var stationName = decodeURIComponent(params.get('station') || '');
        var kakaoKey = params.get('jskey');
        var restKey = params.get('restkey');

        document.getElementById('dest-title').innerText = '🚏 ' + stationName;

        // 카카오맵 링크 (기본: 목적지만)
        var linkEl = document.getElementById('kakao-link');
        linkEl.href = 'https://map.kakao.com/link/to/' + stationName + ',' + destLat + ',' + destLng;

        // SDK 동적 로드
        var script = document.createElement('script');
        script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + kakaoKey + '&autoload=false';
        script.onload = function() {
            kakao.maps.load(initMap);
        };
        document.head.appendChild(script);

        function initMap() {
            var container = document.getElementById('map');
            var map = new kakao.maps.Map(container, {
                center: new kakao.maps.LatLng(destLat, destLng),
                level: 4
            });

            // 목적지 마커
            var destMarker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(destLat, destLng),
                map: map
            });
            var destInfoW = new kakao.maps.InfoWindow({
                content: '<div style="padding:5px;font-size:13px;font-weight:bold;">🚏 ' + stationName + '</div>'
            });
            destInfoW.open(map, destMarker);

            // iframe 내에서 직접 위치 가져오기
            if (!navigator.geolocation) {
                document.getElementById('route-info').innerText = '이 브라우저는 위치 기능을 지원하지 않습니다.';
                return;
            }

            document.getElementById('route-info').innerText = '📍 현재 위치를 확인하는 중...';

            navigator.geolocation.getCurrentPosition(function(pos) {
                var myLat = pos.coords.latitude;
                var myLng = pos.coords.longitude;

                // 카카오맵 링크 업데이트 (출발지 포함)
                linkEl.href = 'https://map.kakao.com/link/from/내위치,' + myLat + ',' + myLng +
                              '/to/' + stationName + ',' + destLat + ',' + destLng;

                // 내 위치 마커
                var myImg = new kakao.maps.MarkerImage(
                    'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
                    new kakao.maps.Size(24, 35)
                );
                var myMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(myLat, myLng),
                    map: map,
                    image: myImg
                });
                var myInfoW = new kakao.maps.InfoWindow({
                    content: '<div style="padding:5px;font-size:13px;color:#e74c3c;font-weight:bold;">📍 내 위치</div>'
                });
                myInfoW.open(map, myMarker);

                // 경로 API 호출
                fetch('https://apis-navi.kakaomobility.com/v1/directions?origin=' +
                    myLng + ',' + myLat + '&destination=' + destLng + ',' + destLat +
                    '&priority=RECOMMEND', {
                    headers: { 'Authorization': 'KakaoAK ' + restKey }
                })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.routes && data.routes[0] && data.routes[0].result_code === 0) {
                    var route = data.routes[0];
                    var dist = route.summary.distance;
                    var dur = route.summary.duration;
                    var distText = dist >= 1000 ? (dist/1000).toFixed(1) + 'km' : dist + 'm';
                    var durMin = Math.ceil(dur / 60);
                    document.getElementById('route-info').innerHTML =
                        '🚶 거리 <b>' + distText + '</b> · 약 <b>' + durMin + '분</b>';

                    var linePath = [];
                    route.sections.forEach(function(section) {
                        section.roads.forEach(function(road) {
                            for (var i = 0; i < road.vertexes.length; i += 2) {
                                linePath.push(new kakao.maps.LatLng(road.vertexes[i+1], road.vertexes[i]));
                            }
                        });
                    });

                    new kakao.maps.Polyline({
                        path: linePath,
                        strokeWeight: 5,
                        strokeColor: '#3498db',
                        strokeOpacity: 0.9,
                        strokeStyle: 'solid'
                    }).setMap(map);

                    var stepsHtml = '';
                    var stepNum = 1;
                    route.sections.forEach(function(section) {
                        section.guides.forEach(function(guide) {
                            if (guide.name && guide.guidance) {
                                stepsHtml += '<div class="step">' + stepNum + '. ' +
                                    guide.guidance + ' (' + guide.name + ')</div>';
                                stepNum++;
                            }
                        });
                    });
                    if (stepsHtml) document.getElementById('steps').innerHTML = stepsHtml;

                    var bounds = new kakao.maps.LatLngBounds();
                    linePath.forEach(function(p) { bounds.extend(p); });
                    map.setBounds(bounds);
                } else {
                    showStraightLine();
                }
            })
            .catch(function() { showStraightLine(); });

                function showStraightLine() {
                    var path = [
                        new kakao.maps.LatLng(myLat, myLng),
                        new kakao.maps.LatLng(destLat, destLng)
                    ];
                    var pl = new kakao.maps.Polyline({
                        path: path, strokeWeight: 4,
                        strokeColor: '#3498db', strokeOpacity: 0.7, strokeStyle: 'dashed'
                    });
                    pl.setMap(map);
                    var dist = Math.round(pl.getLength());
                    var walkMin = Math.ceil(dist / 67);
                    var distText = dist >= 1000 ? (dist/1000).toFixed(1) + 'km' : dist + 'm';
                    document.getElementById('route-info').innerHTML =
                        '🚶 직선 거리 <b>' + distText + '</b> · 도보 약 <b>' + walkMin + '분</b>';
                    var bounds = new kakao.maps.LatLngBounds();
                    bounds.extend(new kakao.maps.LatLng(myLat, myLng));
                    bounds.extend(new kakao.maps.LatLng(destLat, destLng));
                    map.setBounds(bounds);
                }
            }, function(err) {
                document.getElementById('route-info').innerText = '📍 위치 권한을 허용해주세요. (주소창 왼쪽 🔒 클릭)';
            }, { enableHighAccuracy: true, timeout: 10000 });
        }
    </script>
</body>
</html>
