<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a3f4668a3bb3a2a1510f37a1fab5a398&autoload=false"></script>
<style>
  * { margin: 0; padding: 0; }
  #map { width: 100%; height: 450px; border-radius: 16px; }
</style>
</head><body>
<div id="map"></div>
<script>
kakao.maps.load(function() {
  var container = document.getElementById('map');
  var map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.27118400387304, 127.02787227465424),
    level: 5,
    mapTypeId: kakao.maps.MapTypeId.HYBRID
  });

  // 일반/위성 토글 컨트롤 (우측 상단)
  var mapTypeControl = new kakao.maps.MapTypeControl();
  map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);
  // 줌 컨트롤
  var zoomControl = new kakao.maps.ZoomControl();
  map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

  var bounds = new kakao.maps.LatLngBounds();

  // 위성 배경 가시성 ↑ : 흰색 외곽 + 컬러 안쪽 두 겹 폴리라인
  var sections = [{"coords": [{"lat": 37.262871, "lng": 127.02795}, {"lat": 37.263387, "lng": 127.026027}, {"lat": 37.263404, "lng": 127.025891}, {"lat": 37.263447, "lng": 127.025677}, {"lat": 37.263555, "lng": 127.025619}, {"lat": 37.264613, "lng": 127.026045}, {"lat": 37.264613, "lng": 127.026045}, {"lat": 37.268193, "lng": 127.027476}, {"lat": 37.268581, "lng": 127.027516}, {"lat": 37.269449, "lng": 127.027922}, {"lat": 37.269449, "lng": 127.027922}, {"lat": 37.270181, "lng": 127.028138}, {"lat": 37.271084, "lng": 127.028487}, {"lat": 37.271265, "lng": 127.028564}, {"lat": 37.271311, "lng": 127.028586}, {"lat": 37.271356, "lng": 127.028619}, {"lat": 37.271772, "lng": 127.028772}, {"lat": 37.272576, "lng": 127.029077}, {"lat": 37.272576, "lng": 127.029077}, {"lat": 37.273417, "lng": 127.029405}, {"lat": 37.27395, "lng": 127.029612}, {"lat": 37.274493, "lng": 127.029819}, {"lat": 37.274854, "lng": 127.029961}, {"lat": 37.275044, "lng": 127.030015}, {"lat": 37.275478, "lng": 127.030213}, {"lat": 37.275523, "lng": 127.030257}, {"lat": 37.275867, "lng": 127.030388}, {"lat": 37.275867, "lng": 127.030388}, {"lat": 37.276156, "lng": 127.030474}, {"lat": 37.276644, "lng": 127.03066}, {"lat": 37.277711, "lng": 127.031086}, {"lat": 37.278063, "lng": 127.031206}, {"lat": 37.278224, "lng": 127.031079}, {"lat": 37.278304, "lng": 127.030864}, {"lat": 37.278346, "lng": 127.030514}, {"lat": 37.278359, "lng": 127.029882}, {"lat": 37.278337, "lng": 127.02942}, {"lat": 37.278337, "lng": 127.02942}, {"lat": 37.278308, "lng": 127.029218}, {"lat": 37.278161, "lng": 127.028825}, {"lat": 37.278078, "lng": 127.028634}, {"lat": 37.277084, "lng": 127.027136}, {"lat": 37.277084, "lng": 127.027136}, {"lat": 37.276947, "lng": 127.026924}, {"lat": 37.276782, "lng": 127.026644}, {"lat": 37.276663, "lng": 127.026364}, {"lat": 37.276561, "lng": 127.026083}, {"lat": 37.275438, "lng": 127.022015}, {"lat": 37.275436, "lng": 127.021835}, {"lat": 37.275415, "lng": 127.021407}], "color": "#2DB400"}];
  sections.forEach(function(sec) {
    var path = sec.coords.map(function(c) {
      var ll = new kakao.maps.LatLng(c.lat, c.lng);
      bounds.extend(ll);
      return ll;
    });
    // 외곽선 (흰색, 두꺼움)
    new kakao.maps.Polyline({
      map: map, path: path,
      strokeWeight: 11, strokeColor: '#FFFFFF',
      strokeOpacity: 0.95, strokeStyle: 'solid'
    });
    // 안쪽 (컬러)
    new kakao.maps.Polyline({
      map: map, path: path,
      strokeWeight: 7, strokeColor: sec.color,
      strokeOpacity: 1.0, strokeStyle: 'solid'
    });
  });

  var walks = [{"coords": [{"lat": 37.26371850687013, "lng": 127.02876941382961}, {"lat": 37.263840706701565, "lng": 127.02830834113884}, {"lat": 37.263874033743484, "lng": 127.0281722414454}, {"lat": 37.263874033743484, "lng": 127.0281722414454}, {"lat": 37.26384903614354, "lng": 127.02814446688656}, {"lat": 37.263799040298956, "lng": 127.0280528099341}, {"lat": 37.263799040298956, "lng": 127.0280528099341}, {"lat": 37.26359906212786, "lng": 127.02797782232813}, {"lat": 37.263504628326245, "lng": 127.02796115981299}, {"lat": 37.263504628326245, "lng": 127.02796115981299}, {"lat": 37.26353239976194, "lng": 127.0277861749143}, {"lat": 37.26353239976194, "lng": 127.0277861749143}, {"lat": 37.26295746255086, "lng": 127.02757232150005}, {"lat": 37.26295746255086, "lng": 127.02757232150005}, {"lat": 37.262863035691986, "lng": 127.02794451259042}], "color": "#FF8C00"}, {"coords": [{"lat": 37.27541424251236, "lng": 127.02140586617352}, {"lat": 37.27540868517046, "lng": 127.02126976756945}], "color": "#FF8C00"}];
  walks.forEach(function(w) {
    var path = w.coords.map(function(c) {
      var ll = new kakao.maps.LatLng(c.lat, c.lng);
      bounds.extend(ll);
      return ll;
    });
    // 외곽선 (흰색, 점선)
    new kakao.maps.Polyline({
      map: map, path: path,
      strokeWeight: 8, strokeColor: '#FFFFFF',
      strokeOpacity: 0.9, strokeStyle: 'shortdashdot'
    });
    // 안쪽 (컬러)
    new kakao.maps.Polyline({
      map: map, path: path,
      strokeWeight: 5, strokeColor: w.color,
      strokeOpacity: 1.0, strokeStyle: 'shortdashdot'
    });
  });

  var startPos = new kakao.maps.LatLng(37.263584678785, 127.028715898311);
  bounds.extend(startPos);
  new kakao.maps.InfoWindow({
    content: '<div style="padding:4px 8px;font-size:12px;font-weight:bold;color:#1565c0;">\ud83d\udea9 현재 위치 (수원시 영통구)</div>'
  }).open(map, new kakao.maps.Marker({ map: map, position: startPos }));

  var endPos = new kakao.maps.LatLng(37.27546918387394, 127.02126744710107);
  bounds.extend(endPos);
  new kakao.maps.InfoWindow({
    content: '<div style="padding:4px 8px;font-size:12px;font-weight:bold;color:#c62828;">\ud83d\udccd 시장</div>'
  }).open(map, new kakao.maps.Marker({ map: map, position: endPos }));

  map.setBounds(bounds, 80);
});
</script>
</body></html>
